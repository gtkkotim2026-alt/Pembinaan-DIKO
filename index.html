Apakah Saudara telah melaporkan atau berkoordinasi dengan kepala satuan pendidikan terkait hal tersebut?

Apakah Saudara memahami bahwa perbuatan tersebut bertentangan dengan ketentuan disiplin pegawai dan kewajiban Saudara sebagai tenaga pendidik/tenaga kependidikan?
Apakah Saudara menyadari bahwa perbuatan tersebut dapat dikenakan sanksi sesuai ketentuan peraturan perundang-undangan?
Apakah Saudara menyesali perbuatan tersebut?
Langkah apa yang akan Saudara lakukan untuk memperbaiki keadaan dan mencegah kejadian serupa?
Apakah Saudara bersedia memperbaiki diri dan tidak mengulangi perbuatan tersebut?

lap(){const x=DB.lap.find(a=>a.id==ed)||{};return pg('Laporan Tindakan Disiplin','Awal proses: laporan → pemanggilan I → pemanggilan II → pelimpahan.',`<div class="grid"><section class="card"><h2>${ed?'Ubah':'Input'} Laporan</h2>${gpick()}
${inp('no','Nomor laporan',x.no)}${inp('tg','Tanggal laporan',x.tgl||today,'date')}${inp('nm','Nama guru',x.nama)}<div class="r2">${inp('nip','NIP',x.nip)}${inp('pk','Pangkat/Gol.',x.pangkat)}</div>${inp('jb','Jabatan',x.jabatan)}${inp('st','Status kepegawaian (PNS/PPPK)',x.statusPeg)}${inp('sk','Satuan pendidikan',x.sekolah)}${inp('pl','Jenis pelanggaran',x.pelanggaran)}${ta('ur','Uraian kejadian',x.uraian)}${inp('pp','Pelapor',x.pelapor)}${sel('stp','Proses',ST,x.status||ST[0])}
<div class="act"><button onclick="saveLap()">Simpan</button>${ed?'<button class="ghost" onclick="ed=null;render()">Batal</button>':''}</div></section>
<section class="card"><h2>Daftar Laporan (${DB.lap.length})</h2>${lst('lap',x=>`<div class="row"><div><b>${h(x.nama)}</b> <span class="b s${ST.indexOf(x.status)}">${x.status}</span><small>${h(x.pelanggaran)} · ${tgl(x.tgl)}</small></div><div><button class="ghost" onclick="ed='${x.id}';render()">Ubah</button><button class="ghost red" onclick="del('lap','${x.id}')">Hapus</button></div></div>`)}</section></div>`)},
pg(){return pg('Pemanggilan','Isian tersimpan dan dicetak sesuai template (menu 6).',`<div class="grid"><section class="card"><h2>Input Pemanggilan</h2>${sel('lp','Laporan',lapO(),'')}${sel('ke','Pemanggilan ke',['I','II'],'I')}${inp('no','Nomor surat')}${inp('ts','Tanggal surat',today,'date')}${inp('ht','Hari/tanggal menghadap','','date')}${inp('jm','Pukul','09.00 WITA')}${inp('tm','Tempat',C.TEMPAT||'')}<button onclick="savePg()">Simpan</button></section>
<section class="card"><h2>Tersimpan</h2>${lst('pg',r=>rowH(`Pemanggilan ${r.ke} – ${L(r.lp).nama}`,`${r.no} · ${hari(r.ht)}`,'prPg','pg',r.id,'wPg'))}</section></div>`)},
bap(){const l=L(sl),qs=DB.tpl.bapQ.split('\n').filter(Boolean),pr=(p,t,n='',j='')=>`<div class="r2">${inp(p+'n','Nama '+t,n)}${inp(p+'j','Jabatan',j)}</div>`;
return pg('Berita Acara Pemeriksaan','Pertanyaan otomatis dari template BAP (menu 7); isi jawaban lalu simpan.',`<div class="grid"><section class="card"><h2>Input BAP</h2>${sel('lp','Laporan',lapO(),sl,'onchange="sl=this.value;render()"')}
${l.id?`<p class="sub">Guru diperiksa: <b>${h(l.nama)}</b> · NIP ${h(l.nip)}</p>${inp('ht','Tanggal pemeriksaan',today,'date')}${inp('tm','Tempat',C.TEMPAT||'')}${pr('pw','Pewawancara',PW.nama||'',PW.jabatan||'')}${inp('pwp','NIP pewawancara',PW.nip||'')}${pr('s1','Saksi I')}${pr('s2','Saksi II')}<h2>Pertanyaan & Jawaban</h2>${qs.map((q,i)=>`<div class="qa">${ta('a'+i,(i+1)+'. '+h(fill(q,lm(l))),'',2)}</div>`).join('')}<button onclick="saveBap()">Simpan BAP</button>`:'<div class="empty">Pilih laporan terlebih dahulu.</div>'}</section>
<section class="card"><h2>Tersimpan</h2>${lst('bap',r=>rowH('BAP – '+L(r.lp).nama,`${hari(r.ht)} · Pemeriksa: ${r.pw.n}`,'prBap','bap',r.id,'wBap'))}</section></div>`)},
pn(){const l=L(sl);return pg('Surat Pernyataan','Guru menyatakan tidak akan mengulangi pelanggaran.',`<div class="grid"><section class="card"><h2>Input Pernyataan</h2>${dxBox('pern')}<small style="display:block;color:var(--mu);margin:-6px 0 10px">Kode khusus di Word: {{isi}} = isi pernyataan, selain kode data guru &amp; penandatangan.</small>${sel('lp','Laporan',lapO(),sl,'onchange="sl=this.value;render()"')}${l.id?`${inp('tg','Tanggal',today,'date')}${ta('tx','Isi pernyataan (dapat diubah)',fill(DB.tpl.pern,lm(l)),14)}<button onclick="savePn()">Simpan</button>`:'<div class="empty">Pilih laporan terlebih dahulu.</div>'}</section>
<section class="card"><h2>Tersimpan</h2>${lst('pn',r=>rowH('Pernyataan – '+L(r.lp).nama,tgl(r.tg),'prPn','pn',r.id,'wPn'))}</section></div>`)},
pl(){return pg('Surat Pelimpahan ke BKPSDM','Dicetak sesuai template (menu 8).',`<div class="grid"><section class="card"><h2>Input Pelimpahan</h2>${sel('lp','Laporan',lapO(),'')}${inp('no','Nomor surat')}${inp('ts','Tanggal surat',today,'date')}${inp('lamp','Lampiran','1 (satu) berkas')}${inp('kpd','Kepada',C.KEPADA_PELIMPAHAN||'')}<button onclick="savePl()">Simpan</button></section>
<section class="card"><h2>Tersimpan</h2>${lst('pl',r=>rowH('Pelimpahan – '+L(r.lp).nama,`${r.no} · ${tgl(r.ts)}`,'prPl','pl',r.id,'wPl'))}</section></div>`)},
tp:()=>tpl('panggil','Template Surat Pemanggilan',['no_surat','panggilan_ke','hari_tgl','jam','tempat']),
tb(){return pg('Template BAP','Teks pembuka BAP dan daftar pertanyaan (satu pertanyaan per baris).',`<div class="card one">${dxBox('bap')}${chips(['pw_nama','pw_nip','pw_jabatan','s1_nama','s1_jabatan','s2_nama','s2_jabatan','hari_tgl','tempat','daftar_qa'])}${ta('t1','Teks BAP',DB.tpl.bap,16)}${ta('t2','Pertanyaan otomatis',DB.tpl.bapQ,8)}<div class="act"><button onclick="saveT('bap','t1');saveT('bapQ','t2')">Simpan</button><button class="ghost" onclick="DB.tpl.bap=D.bap;DB.tpl.bapQ=D.bapQ;save();render()">Kembalikan default</button></div></div>`)},
tl:()=>tpl('limpah','Template Surat Pelimpahan',['no_surat','lampiran','kepada']),
ttd(){const t=DB.ttd;return pg('Penandatangan Surat Dinas','Dipakai pada kop dan tanda tangan semua surat.',`<div class="card one">${inp('i1','Kop baris 1',t.i1)}${inp('i2','Kop baris 2 (instansi)',t.i2)}${inp('al','Alamat kop',t.alamat)}${inp('ko','Kota penandatanganan',t.kota)}${inp('n','Nama penandatangan',t.nama)}<div class="r2">${inp('p','NIP',t.nip)}${inp('pk','Pangkat/Gol.',t.pangkat)}</div>${inp('j','Jabatan',t.jab)}<button onclick="saveTtd()">Simpan</button></div>`)},
dok(){const J=['Pemanggilan I','Pemanggilan II','BAP','Surat Pernyataan','Surat Pelimpahan'];return pg('Dokumen Pemeriksaan','Unggah hasil scan/foto bertanda tangan (PDF/JPG/PNG, maks. 1,5 MB), terhubung ke data laporan awal.',`<div class="grid"><section class="card"><h2>Unggah Dokumen</h2>${sel('lp','Laporan',lapO(),sl)}${sel('jn','Jenis dokumen',J,'')}<label>File<input id="fl" type="file" accept=".pdf,image/*"></label><button onclick="upDok()">Unggah</button></section>
<section class="card"><h2>Berkas per Laporan</h2>${DB.lap.map(l=>{const d=DB.dok.filter(x=>x.lp==l.id);return`<div class="row" style="display:block"><b>${h(l.nama)}</b> <span class="b s${ST.indexOf(l.status)}">${l.status}</span><small>${h(l.pelanggaran)} · laporan ${tgl(l.tgl)}</small>${d.length?d.map(x=>`<div class="row"><div><a href="${x.data}" download="${h(x.jn+' - '+l.nama+' - '+x.nm)}">${h(x.jn)}</a><small>${h(x.nm)}</small></div><div><button class="ghost red" onclick="del('dok','${x.id}')">Hapus</button></div></div>`).join(''):'<small>Belum ada berkas.</small>'}</div>`}).join('')||'<div class="empty">Belum ada laporan.</div>'}</section></div>`)}};
const M=[['lap','Laporan Tindakan'],['pg','Pemanggilan'],['bap','BAP'],['pn','Surat Pernyataan'],['pl','Surat Pelimpahan'],['tp','Template Pemanggilan'],['tb','Template BAP'],['tl','Template Pelimpahan'],['ttd','Penandatangan'],['dok','Dokumen']];
const chips=a=>`<div class="chips">${['nama','nip','pangkat','jabatan','sekolah','pelanggaran','status_peg','tgl_laporan','tgl_surat','kota','ttd_nama','ttd_nip','ttd_pangkat','ttd_jabatan',...a].map(c=>`<code>{{${c}}}</code>`).join('')}</div>`;
function tpl(k,t,a){return pg(t,'Gunakan kode berikut; akan diisi otomatis dari data laporan.',`<div class="card one">${dxBox(k)}${chips(a)}${ta('t1','Template teks (cadangan, dipakai bila template Word belum diunggah)',DB.tpl[k],20)}<div class="act"><button onclick="saveT('${k}','t1')">Simpan</button><button class="ghost" onclick="DB.tpl['${k}']=D['${k}'];save();render()">Kembalikan default</button></div></div>`)}
function saveT(k,id){DB.tpl[k]=g(id);if(save())alert('Template tersimpan.')}
function saveTtd(){DB.ttd={i1:g('i1'),i2:g('i2'),alamat:g('al'),kota:g('ko'),nama:g('n'),nip:g('p'),pangkat:g('pk'),jab:g('j')};if(save())alert('Tersimpan.')}
function saveLap(){if(!g('nm')||!g('pl'))return alert('Nama guru dan jenis pelanggaran wajib diisi.');const x={id:ed||uid(),no:g('no'),tgl:g('tg'),nama:g('nm'),nip:g('nip'),pangkat:g('pk'),jabatan:g('jb'),sekolah:g('sk'),statusPeg:g('st'),pelanggaran:g('pl'),uraian:g('ur'),pelapor:g('pp'),status:g('stp')};ed?DB.lap[DB.lap.findIndex(a=>a.id==ed)]=x:DB.lap.push(x);ed=null;save();render()}
const need=()=>g('lp')||(alert('Pilih laporan terlebih dahulu.'),0);
function savePg(){const lp=need();if(!lp)return;DB.pg.push({id:uid(),lp,ke:g('ke'),no:g('no'),ts:g('ts'),ht:g('ht'),jm:g('jm'),tm:g('tm')});adv(lp,'Pemanggilan '+g('ke'));save();render()}
function saveBap(){const lp=need();if(!lp)return;const qs=DB.tpl.bapQ.split('\n').filter(Boolean);DB.bap.push({id:uid(),lp,ht:g('ht'),tm:g('tm'),pw:{n:g('pwn'),j:g('pwj'),nip:g('pwp')},s1:{n:g('s1n'),j:g('s1j')},s2:{n:g('s2n'),j:g('s2j')},qa:qs.map((q,i)=>({q:fill(q,lm(L(lp))),a:g('a'+i)}))});save();sl='';render()}
function savePn(){const lp=need();if(!lp)return;DB.pn.push({id:uid(),lp,tg:g('tg'),tx:g('tx')});save();sl='';render()}
function savePl(){const lp=need();if(!lp)return;DB.pl.push({id:uid(),lp,no:g('no'),ts:g('ts'),lamp:g('lamp'),kpd:g('kpd')});adv(lp,'Pelimpahan');save();render()}
function upDok(){const lp=need();if(!lp)return;const f=$('#fl').files[0];if(!f)return alert('Pilih file.');if(f.size>1.5e6)return alert('Ukuran file maksimal 1,5 MB.');const r=new FileReader();r.onload=()=>{DB.dok.push({id:uid(),lp,jn:g('jn'),nm:f.name,data:r.result});sl=lp;if(save())render()};r.readAsDataURL(f)}
const kt=()=>({kota:DB.ttd.kota});
const mPg=r=>({...lm(L(r.lp)),...tm(),...kt(),no_surat:r.no,tgl_surat:tgl(r.ts),panggilan_ke:r.ke,hari_tgl:hari(r.ht),jam:r.jm,tempat:r.tm});
const mBap=r=>({...lm(L(r.lp)),...tm(),...kt(),tgl_surat:tgl(r.ht),hari_tgl:hari(r.ht),tempat:r.tm,pw_nama:r.pw.n,pw_nip:r.pw.nip,pw_jabatan:r.pw.j,s1_nama:r.s1.n,s1_jabatan:r.s1.j,s2_nama:r.s2.n,s2_jabatan:r.s2.j,daftar_qa:r.qa.map((x,i)=>`${i+1}. Pertanyaan : ${x.q}\n    Jawaban    : ${x.a||'-'}`).join('\n\n')});
const mPl=r=>({...lm(L(r.lp)),...tm(),...kt(),no_surat:r.no,tgl_surat:tgl(r.ts),lampiran:r.lamp,kepada:r.kpd});
const prPg=id=>{const r=DB.pg.find(a=>a.id==id);if(DB.tpl.dx_panggil)return cetakDx('panggil',mPg(r),r);cetak(kop()+`<div class="body">${h(fill(DB.tpl.panggil,mPg(r)))}</div>`+ttdB(r.ts))};
const prBap=id=>{const r=DB.bap.find(a=>a.id==id),l=L(r.lp);if(DB.tpl.dx_bap)return cetakDx('bap',mBap(r),r);
cetak(kop()+`<h3 class="c">BERITA ACARA PEMERIKSAAN</h3><div class="body">${h(fill(DB.tpl.bap,mBap(r)))}</div><div class="sig">${sg('Pemeriksa',r.pw.n,'NIP. '+h(r.pw.nip))}${sg('Yang Diperiksa',l.nama,'NIP. '+h(l.nip))}${sg('Saksi I',r.s1.n)}${sg('Saksi II',r.s2.n)}</div>`)};
const prPn=id=>{const r=DB.pn.find(a=>a.id==id),l=L(r.lp);if(DB.tpl.dx_pern)return cetakDx('pern',mPn(r),r);cetak(kop()+`<h3 class="c">SURAT PERNYATAAN</h3><div class="body">${h(r.tx)}</div><div class="sig"><div>Mengetahui,<br>${h(DB.ttd.jab)}<br><br><br><br><b><u>${h(DB.ttd.nama)||'………'}</u></b><br>NIP. ${h(DB.ttd.nip)}</div><div>${h(DB.ttd.kota)}, ${tgl(r.tg)}<br>Yang membuat pernyataan,<br><span class="mt">Meterai</span><br><b><u>${h(l.nama)}</u></b><br>NIP. ${h(l.nip)}</div></div>`)};
const prPl=id=>{const r=DB.pl.find(a=>a.id==id);if(DB.tpl.dx_limpah)return cetakDx('limpah',mPl(r),r);cetak(kop()+`<div class="body">${h(fill(DB.tpl.limpah,mPl(r)))}</div>`+ttdB(r.ts))};
const MT='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const erm=e=>{const er=e.properties&&e.properties.errors;return er?er.map(x=>x.properties.explanation||x.message).join('; '):e.message};
function mk(k,m){const z=new PizZip(DB.tpl['dx_'+k].data.split(',')[1],{base64:true}),d=new docxtemplater(z,{delimiters:{start:'{{',end:'}}'},paragraphLoop:true,linebreaks:true,nullGetter:()=>'…'});d.render(m);return d.getZip().generate({type:'blob',mimeType:MT})}
function wd(k,m,nm){if(!DB.tpl['dx_'+k])return alert('Unggah template .docx di menu template terlebih dahulu.');
try{const a=document.createElement('a');a.href=URL.createObjectURL(mk(k,m));a.download=nm+'.docx';a.click()}catch(e){alert('Gagal membuat Word: '+erm(e))}}
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
async function cetakDx(k,m,r,force){const nm=NM[k]+' - '+m.nama,src=k+r.id;let d=DB.dok.find(x=>x.src==src);
if(force&&d){DB.dok=DB.dok.filter(x=>x.src!=src);d=null}
$('#pvt').textContent=nm;$('#pv').hidden=false;
if(!d){$('#pvb').innerHTML='<div class="empty">Membuat PDF dari template Word…</div>';
try{const j=await api('disiplinPdf',{docx:await b64(mk(k,m)),nama:nm});d={id:uid(),lp:r.lp,jn:NM[k]+(k=='panggil'?' '+r.ke:'')+' (PDF)',nm:nm+'.pdf',src,data:'data:application/pdf;base64,'+j.pdf};DB.dok.push(d);save()}
catch(e){if(confirm('Gagal membuat PDF: '+erm(e)+'\n\nTampilkan pratinjau cepat dari browser? (format bisa berbeda dari Word)'))return prev(nm,{k,m,nm});return pvClose()}}
const url=URL.createObjectURL(await (await fetch(d.data)).blob());PV={k,m,r,nm,pdf:d.data,url};$('#pvw').hidden=$('#pvu').hidden=$('#pvr').hidden=false;
$('#pvb').innerHTML=`<iframe id="pvf" src="${url}" style="width:100%;height:100%;border:0;background:#fff"></iframe>`}
const wPg=id=>{const r=DB.pg.find(a=>a.id==id);wd('panggil',mPg(r),`Pemanggilan ${r.ke} - ${L(r.lp).nama}`)};
const wBap=id=>{const r=DB.bap.find(a=>a.id==id);wd('bap',mBap(r),`BAP - ${L(r.lp).nama}`)};
const mPn=r=>({...lm(L(r.lp)),...tm(),...kt(),tgl_surat:tgl(r.tg),isi:r.tx});
const wPn=id=>{const r=DB.pn.find(a=>a.id==id);wd('pern',mPn(r),`Pernyataan - ${L(r.lp).nama}`)};
const wPl=id=>{const r=DB.pl.find(a=>a.id==id);wd('limpah',mPl(r),`Pelimpahan - ${L(r.lp).nama}`)};
function upTpl(k,i){const f=i.files[0];if(!f)return;if(f.size>1e6)return alert('Ukuran template maksimal 1 MB.');const r=new FileReader();r.onload=()=>{DB.tpl['dx_'+k]={nm:f.name,data:r.result};if(save())render()};r.readAsDataURL(f)}
const dxBox=k=>{const d=DB.tpl['dx_'+k];return`<div style="border:1px dashed #94a3b8;border-radius:10px;padding:12px;margin-bottom:14px"><b style="font-size:12px">Template Word (.docx)</b>${d?`<div class="row"><div><b>${h(d.nm)}</b><small>Aktif · dipakai untuk membuat PDF, pratinjau, dan cetak</small></div><div><button class="ghost red" onclick="delete DB.tpl['dx_${k}'];save();render()">Hapus</button></div></div>`:'<small style="display:block;color:var(--mu);margin:4px 0">Belum ada. Unggah file .docx yang berisi kode seperti {{nama}}.</small>'}<input type="file" accept=".docx" onchange="upTpl('${k}',this)"></div>`};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='pembinaan-disiplin-'+today+'.json';a.click()}
function imp(i){const f=i.files[0];if(!f||!confirm('Data saat ini akan diganti dengan cadangan. Lanjutkan?'))return;const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);DB.tpl={...D,...DB.tpl};save();render()}catch(e){alert('File cadangan tidak valid.')}};r.readAsText(f)}
function render(){const k=P[location.hash.slice(1)]?location.hash.slice(1):'lap';$('#nav').innerHTML=M.map(([a,t],i)=>`<a href="#${a}" class="${a==k?'on':''}"><i>${i+1}</i>${t}</a>${i==4||i==7?'<hr>':''}`).join('');$('#main').innerHTML=P[k]();scrollTo(0,0)}
addEventListener('hashchange',()=>{sl='';ed=null;render()});try{GR.refs=JSON.parse(sessionStorage.getItem('pdrf')||'[]')}catch(e){}
render();loadGuru();
</script></body></html>
